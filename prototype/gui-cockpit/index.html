<!doctype html>
<!--
  PROTOTYPE — reference layout for docs/architecture/gui-cockpit.md.
  Answers "what should the Dashboard + Détail projet screens look like?"
  Split-view variant (A), retained after grilling 3 alternatives — see
  gui-cockpit.md §10 for the decision record and the archived learnings
  pulled from the two discarded variants (B: card dashboard + dedicated
  page, C: dense table with inline row expansion). Full exploration is
  preserved on the throwaway branch `prototype/gui-cockpit-variants`.
  All data below is mocked in-memory — no real CLI is spawned.
  This is still throwaway code (no tests, mocked data): it is the direct
  basis for implementation Lot 1+ (gui-cockpit.md §9), to be rewritten
  properly against real CliInvoker calls, not promoted as-is.
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Loop Engine — GUI Cockpit (prototype de référence)</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-panel: #161922;
    --bg-panel-2: #1d2130;
    --border: #2a2f3f;
    --text: #e6e8ee;
    --text-dim: #9aa1b4;
    --accent: #5b8cff;
    --good: #3ecf8e;
    --warn: #e8b93f;
    --bad: #f26d6d;
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  #app { height: 100vh; display: flex; flex-direction: column; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .badge.good { background: rgba(62,207,142,.15); color: var(--good); }
  .badge.warn { background: rgba(232,185,63,.15); color: var(--warn); }
  .badge.bad  { background: rgba(242,109,109,.15); color: var(--bad); }
  .badge.dirty { background: rgba(232,185,63,.15); color: var(--warn); }
  .badge.clean { background: rgba(62,207,142,.15); color: var(--good); }

  button {
    font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg-panel-2); color: var(--text); padding: 4px 10px;
  }
  button:hover { border-color: var(--accent); }
  button.ghost { background: transparent; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }

  .section {
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden;
    background: var(--bg-panel);
  }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; cursor: pointer; user-select: none;
  }
  .section-head h4 { margin: 0; font-size: 13px; font-weight: 600; }
  .section-head .caret { color: var(--text-dim); transition: transform .15s; }
  .section.open .caret { transform: rotate(90deg); }
  .section-body { padding: 0 14px 14px; display: none; }
  .section.open .section-body { display: block; }
  .section-actions { display: flex; align-items: center; gap: 8px; }

  .text-panel {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; font-size: 12.5px; white-space: pre-wrap; max-height: 220px; overflow: auto;
  }
  .json-panel {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; font-size: 12.5px; max-height: 260px; overflow: auto;
  }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; font-size: 12.5px; }
  .kv dt { color: var(--text-dim); }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--text-dim); font-size: 12.5px; padding: 8px 0; }
  .error-panel {
    border: 1px solid var(--bad); background: rgba(242,109,109,.08); border-radius: 6px;
    padding: 10px; font-size: 12.5px;
  }
  .error-panel .stack { color: var(--text-dim); font-size: 11px; margin-top: 6px; }

</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   MOCK DATA + MOCK "CLI" LAYER
   Mirrors the JSON shapes from docs/architecture/gui-cockpit.md §7.
   Simulated latency + in-memory cache stand in for CliInvoker + SectionCache.
   Mirrors what the real implementation's CliInvoker/SectionCache (see
   gui-cockpit.md §5) will do — this mock boundary is exactly where real
   spawn calls plug in during implementation.
   ========================================================================= */

const PROJECTS = [
  { name: "creatyss", type: "next-prisma", path: "../CREATYSS", git: { branch: "main", clean: false }, health: "warning" },
  { name: "lp-infra", type: "infra", path: "../lp-infra", git: { branch: "main", clean: true }, health: "good" },
  { name: "n8n", type: "automation", path: "../n8n", git: { branch: "main", clean: true }, health: "good" },
  { name: "loop-engine", type: "cli", path: ".", git: { branch: "main", clean: false }, health: "warning" },
];

const DETAIL = {
  creatyss: {
    status: { branch: "main", clean: false, docsMissing: ["docs/roadmap/projet-creatyss.md"], health: "warning" },
    next: { candidate: "Lot 24 — corriger la validation du formulaire de paiement", risk: "warning" },
    context: "## Contexte — creatyss\n\nBranche: main (dirty)\nFichiers modifiés: 3\n\n- src/app/checkout/page.tsx\n- src/lib/payment/validate.ts\n- tests/checkout.test.ts\n\nCandidat roadmap détecté: 'TODO: valider le montant avant soumission'\n(docs/roadmap/projet-creatyss.md, ligne 42)",
    prompt: "Tu es un agent chargé du lot 'Lot 24 — corriger la validation du formulaire de paiement' sur le projet creatyss.\nContexte joint. Respecte les contraintes du projet (typecheck + lint obligatoires).",
    review: { summary: "2 fichiers non couverts par un test", findings: ["src/lib/payment/validate.ts:18 — validation du montant absente côté client"] },
    plan: { mode: "plan", agentPolicy: { capability: "code-edit", effort: "medium", selectedAgent: "claude-code (forecast)" }, contextPackage: { files: 3, truncated: false } },
  },
  "lp-infra": {
    status: { branch: "main", clean: true, docsMissing: [], health: "good" },
    next: { candidate: null, risk: null },
    context: "## Contexte — lp-infra\n\nBranche: main (clean)\nAucun candidat roadmap actif détecté.",
    prompt: "Aucune action recommandée pour le moment sur lp-infra.",
    review: { summary: "Rien à signaler", findings: [] },
    plan: { mode: "plan", agentPolicy: null, contextPackage: { files: 0, truncated: false } },
  },
  n8n: {
    status: { branch: "main", clean: true, docsMissing: [], health: "good" },
    next: { candidate: "Documenter le workflow de notification Slack", risk: "safe" },
    context: "## Contexte — n8n\n\nBranche: main (clean)\nCandidat roadmap: 'TODO: documenter le workflow Slack'",
    prompt: "Tu es un agent chargé de documenter le workflow de notification Slack sur le projet n8n.",
    review: { summary: "OK", findings: [] },
    plan: { mode: "plan", agentPolicy: { capability: "docs", effort: "low", selectedAgent: "claude-code (forecast)" }, contextPackage: { files: 1, truncated: false } },
  },
  "loop-engine": {
    status: { branch: "main", clean: false, docsMissing: [], health: "warning" },
    next: { candidate: "Vérifier le contrat JSON de la commande status (risque R-3)", risk: "warning" },
    context: "## Contexte — loop-engine\n\nBranche: main (dirty)\nFichiers modifiés: docs/architecture/gui-cockpit.md, docs/architecture/adr/0006-*.md",
    prompt: "Tu es un agent chargé de vérifier si `status` expose un contrat --json dédié.",
    review: { summary: "1 risque architecture ouvert (R-3)", findings: ["status: contrat --json non confirmé"] },
    plan: { mode: "plan", agentPolicy: { capability: "investigation", effort: "low", selectedAgent: "claude-code (forecast)" }, contextPackage: { files: 2, truncated: false } },
  },
};

const cache = new Map(); // key: `${project}:${section}` -> data

function fetchSection(project, section, { fail = false } = {}) {
  const key = `${project}:${section}`;
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      if (fail) { reject(new Error("spawn ENOENT: pnpm introuvable dans le PATH configuré")); return; }
      const data = DETAIL[project][section];
      cache.set(key, data);
      resolve(data);
    }, 500 + Math.random() * 500);
  });
}

function healthBadge(h) {
  const cls = h === "good" ? "good" : h === "warning" ? "warn" : "bad";
  return `<span class="badge ${cls}">${h}</span>`;
}
function cleanBadge(clean) {
  return `<span class="badge ${clean ? "clean" : "dirty"}">${clean ? "clean" : "dirty"}</span>`;
}

/* =========================================================================
   SHARED SECTION WIDGET (behaviour only — markup/CSS classes are shared,
   but each variant decides *where* and *how* to place it)
   ========================================================================= */

function buildSection({ id, title, project, sectionKey, eager, kind, subtitle }) {
  const el = document.createElement("div");
  el.className = "section";
  el.id = id;
  let state = "idle"; // idle | loading | loaded | error

  el.innerHTML = `
    <div class="section-head">
      <div>
        <span class="caret">▸</span>
        <strong>${title}</strong>
        ${subtitle ? `<span class="mono" style="color:var(--text-dim);font-size:11px;margin-left:8px;">${subtitle}</span>` : ""}
      </div>
      <div class="section-actions">
        <span class="status-slot"></span>
        <button class="ghost refresh-btn" title="Actualiser cette section">⟳</button>
      </div>
    </div>
    <div class="section-body"><div class="empty">Repliée</div></div>
  `;

  const head = el.querySelector(".section-head");
  const body = el.querySelector(".section-body");
  const statusSlot = el.querySelector(".status-slot");
  const refreshBtn = el.querySelector(".refresh-btn");

  function render() {
    if (state === "loading") {
      statusSlot.innerHTML = `<span class="spinner"></span>`;
      body.innerHTML = `<div class="empty"><span class="spinner"></span> Chargement…</div>`;
      return;
    }
    if (state === "error") {
      statusSlot.innerHTML = "";
      body.innerHTML = `
        <div class="error-panel">
          <strong>Impossible d'exécuter la commande</strong>
          <div class="stack mono">${cache.get("__lasterr__") || "spawn ENOENT"}</div>
          <div style="margin-top:8px;display:flex;gap:8px;">
            <button class="ghost copy-btn">Copier les détails</button>
            <button class="ghost settings-btn">Ouvrir les Réglages</button>
          </div>
        </div>`;
      return;
    }
    if (state === "loaded") {
      const data = cache.get(`${project}:${sectionKey}`);
      statusSlot.innerHTML = `<span style="color:var(--text-dim);font-size:11px;">en cache</span>`;
      body.innerHTML = "";
      if (kind === "text") {
        const pre = document.createElement("div");
        pre.className = "text-panel mono";
        pre.textContent = data;
        const copyBtn = document.createElement("button");
        copyBtn.className = "ghost";
        copyBtn.style.marginTop = "8px";
        copyBtn.textContent = "Copier";
        copyBtn.onclick = () => navigator.clipboard?.writeText(data);
        body.appendChild(pre);
        body.appendChild(copyBtn);
      } else {
        const pre = document.createElement("pre");
        pre.className = "json-panel mono";
        pre.textContent = JSON.stringify(data, null, 2);
        body.appendChild(pre);
      }
      return;
    }
    body.innerHTML = `<div class="empty">Repliée</div>`;
    statusSlot.innerHTML = "";
  }

  function load(force = false) {
    const key = `${project}:${sectionKey}`;
    if (!force && cache.has(key)) { state = "loaded"; render(); return; }
    state = "loading"; render();
    fetchSection(project, sectionKey).then(() => {
      state = "loaded"; render();
    }).catch((e) => {
      cache.set("__lasterr__", e.message);
      state = "error"; render();
    });
  }

  head.addEventListener("click", (e) => {
    if (e.target === refreshBtn) return;
    el.classList.toggle("open");
    if (el.classList.contains("open") && state === "idle") load();
  });
  refreshBtn.addEventListener("click", (e) => { e.stopPropagation(); load(true); });

  render();
  if (eager) { el.classList.add("open"); load(); }

  return el;
}

/* =========================================================================
   VARIANT A — "Master-detail" persistent split view.
   Left: always-visible project list. Right: detail pane, no navigation.
   ========================================================================= */
function renderVariantA(root) {
  root.innerHTML = `
    <div style="display:flex; height:100%;">
      <aside style="width:260px; border-right:1px solid var(--border); background:var(--bg-panel); overflow-y:auto;">
        <div style="padding:14px 14px 8px; display:flex; align-items:center; justify-content:space-between;">
          <strong style="font-size:13px;">Projets</strong>
          <button class="ghost" id="a-refresh-all" title="Actualiser">⟳</button>
        </div>
        <div id="a-list"></div>
      </aside>
      <main id="a-detail" style="flex:1; overflow-y:auto; padding:20px;"></main>
    </div>
  `;
  const list = root.querySelector("#a-list");
  let selected = PROJECTS[0].name;

  function renderList() {
    list.innerHTML = "";
    PROJECTS.forEach(p => {
      const row = document.createElement("div");
      row.style.cssText = `padding:10px 14px; cursor:pointer; border-left:3px solid ${p.name === selected ? "var(--accent)" : "transparent"}; background:${p.name === selected ? "var(--bg-panel-2)" : "transparent"};`;
      row.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="mono" style="font-size:13px;">${p.name}</span>
          ${healthBadge(p.health)}
        </div>
        <div style="font-size:11px; color:var(--text-dim); margin-top:2px;">${p.git.branch} · ${cleanBadge(p.git.clean)}</div>
      `;
      row.onclick = () => { selected = p.name; renderList(); renderDetail(); };
      list.appendChild(row);
    });
  }

  function renderDetail() {
    const detail = root.querySelector("#a-detail");
    const p = PROJECTS.find(x => x.name === selected);
    detail.innerHTML = `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
        <h2 style="margin:0;">${p.name}</h2>
        ${healthBadge(p.health)}
        <span class="mono" style="color:var(--text-dim); font-size:12px;">${p.path}</span>
      </div>
      <div id="a-sections"></div>
    `;
    const sections = detail.querySelector("#a-sections");
    sections.appendChild(buildSection({ id: "a-status", title: "Statut", project: p.name, sectionKey: "status", eager: true, kind: "json" }));
    sections.appendChild(buildSection({ id: "a-next", title: "Prochaine action", project: p.name, sectionKey: "next", eager: true, kind: "json" }));
    sections.appendChild(buildSection({ id: "a-context", title: "Contexte", project: p.name, sectionKey: "context", eager: false, kind: "text" }));
    sections.appendChild(buildSection({ id: "a-prompt", title: "Prompt", project: p.name, sectionKey: "prompt", eager: false, kind: "text" }));
    sections.appendChild(buildSection({ id: "a-review", title: "Review", project: p.name, sectionKey: "review", eager: false, kind: "json" }));
    sections.appendChild(buildSection({ id: "a-plan", title: "Plan (prévisionnel)", project: p.name, sectionKey: "plan", eager: false, kind: "json" }));
  }

  renderList();
  renderDetail();
}

/* =========================================================================
   BOOTSTRAP — single reference layout, no variant switcher.
   ========================================================================= */
renderVariantA(document.getElementById("app"));
</script>
</body>
</html>
