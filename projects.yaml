workspace_policy:
  min_free_disk_gib: 20

projects:
  - name: development-workspace
    path: ../development-workspace
    repository: Deadpool042/development-workspace
    workspace:
      mode: permanent
      dependencies: production
    type: development-workspace
    required_docs:
      - AGENTS.md
      - README.md
      - roadmap/workflow-roadmap.md
    validation: []
    planning:
      mode: roadmap
      objective_source: docs/objective.md
    roadmap:
      - roadmap/workflow-roadmap.md

  - name: creatyss
    path: ../CREATYSS
    repository: Deadpool042/CREATYSS
    workspace:
      mode: source_only
      dependencies: on_demand
    type: next-prisma
    required_docs:
      - AGENTS.md
      - docs/architecture
      - docs/domains
      - docs/roadmap/README.md
    validation:
      - pnpm run typecheck
      - pnpm run lint
    planning:
      mode: roadmap
      objective_source: docs/objectif-produit.md
    roadmap:
      - docs/roadmap/README.md
      - docs/roadmap/h1-boutique-vendable/README.md
      - docs/roadmap/h2-commerce-fiable/README.md
      - docs/roadmap/h3-administration-avancee/README.md
      - docs/roadmap/h4-plateforme-automatisation/README.md
      - docs/roadmap/gestion-contenu-admin-hygiene/README.md
      - docs/roadmap/editorial-marketing-intents/README.md

  - name: lp-infra
    path: ../lp-infra-runtime
    repository: Deadpool042/LP-INFRA
    workspace:
      mode: source_only
      dependencies: none
    execution_decision: .governance/execution-decision.yaml
    type: infra
    planning:
      mode: roadmap
      objective_source: docs/objective.md
    required_docs:
      - README.md
      - docs
    validation:
      - git diff HEAD --check
      - bash -n templates/infra/backup-offsite-template.sh
      - bash -n templates/infra/deploy-vps-template.sh
    roadmap:
      - docs/roadmap/README.md
      - docs/roadmap/projet-lp-infra.md

  - name: n8n
    path: ../n8n
    workspace:
      mode: none
      dependencies: none
    type: automation
    optional: true
    requires_git: false
    required_docs:
      - README.md
    validation: []
    planning:
      mode: maintenance

  - name: loop-engine
    path: .
    repository: Deadpool042/loop-engine
    workspace:
      mode: permanent
      dependencies: production
    type: node-cli
    planning:
      mode: roadmap
      objective_source: docs/architecture/final-objective.md
    required_docs:
      - README.md
      - docs/architecture/project-intelligence.md
    validation:
      - pnpm run validate
    roadmap:
      - docs/roadmap/loop-engine.md
  - name: openclaw-control
    path: ../openclaw-control
    type: openclaw-extension
    workspace:
      mode: source_only
      dependencies: on_demand
    required_docs:
      - AGENTS.md
      - README.md
      - PROJECT-BRIEF.md
      - docs/roadmap/README.md
    validation: []
    planning:
      mode: roadmap
      objective_source: PROJECT-BRIEF.md
    roadmap:
      - docs/roadmap/README.md
