name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          set -o pipefail
          pnpm run format:check 2>&1 | tee quality.log

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Quality"
            echo
            echo "- Prettier: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee typecheck.log

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Typecheck"
            echo
            echo "- TypeScript: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests and JSON contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          set -o pipefail
          pnpm run test 2>&1 | tee tests.log

      - name: Validate JSON contracts
        run: |
          set -o pipefail
          pnpm run json-check 2>&1 | tee json-check.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics
          path: |
            tests.log
            json-check.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Tests and JSON contracts"
            echo
            echo "- Result: ${{ job.status }}"
            if [[ "${{ job.status }}" != "success" ]]; then
              echo "- Diagnostics: artifact \`test-diagnostics\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  audit-strict:
    name: Strict audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict audit
        run: |
          mkdir -p artifacts
          pnpm exec tsx src/cli.ts audit --json --strict \
            > artifacts/audit-strict.json \
            2> artifacts/audit-strict.stderr.log

      - name: Write compact audit summary
        if: always()
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from "node:fs";

          console.log("## Strict audit\n");
          const path = "artifacts/audit-strict.json";
          if (!existsSync(path)) {
            console.log("- Result: no JSON report produced");
            process.exit(0);
          }

          try {
            const report = JSON.parse(readFileSync(path, "utf8"));
            const summary = report.summary ?? {};
            console.log(`- Status: ${summary.status ?? "unknown"}`);
            console.log(`- Passed: ${summary.pass ?? "?"}/${summary.total ?? "?"}`);
            console.log(`- Score: ${summary.score ?? "?"}`);

            const failed = Array.isArray(report.findings)
              ? report.findings.filter((finding) => finding.status === "fail")
              : [];
            if (failed.length > 0) {
              console.log(`- Failed rules: ${failed.map((finding) => finding.ruleId).join(", ")}`);
            }
          } catch {
            console.log("- Result: invalid JSON report");
          }
          NODE

      - name: Upload strict audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-strict-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  audit-profiles:
    name: Audit profiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run audit profiles
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm run audit:profiles 2>&1 | tee artifacts/audit-profiles.log

      - name: Upload profile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-profile-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Audit profiles"
            echo
            echo "- Result: ${{ job.status }}"
            echo "- Report: artifact \`audit-profile-report\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - quality
      - typecheck
      - tests
      - audit-strict
      - audit-profiles
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TESTS: ${{ needs.tests.result }}
          AUDIT_STRICT: ${{ needs.audit-strict.result }}
          AUDIT_PROFILES: ${{ needs.audit-profiles.result }}
        run: |
          {
            echo "## CI gate"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Quality | $QUALITY |"
            echo "| Typecheck | $TYPECHECK |"
            echo "| Tests and JSON contracts | $TESTS |"
            echo "| Strict audit | $AUDIT_STRICT |"
            echo "| Audit profiles | $AUDIT_PROFILES |"
          } >> "$GITHUB_STEP_SUMMARY"

          results=("$QUALITY" "$TYPECHECK" "$TESTS" "$AUDIT_STRICT" "$AUDIT_PROFILES")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "CI gate rejected: at least one required job did not succeed."
              exit 1
            fi
          done

          echo "CI gate accepted."
