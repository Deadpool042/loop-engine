name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Check changed patch
        run: git diff --check HEAD^ HEAD
      - name: Write summary
        if: always()
        run: |
          {
            echo "## Quality"
            echo
            echo "- Changed-patch whitespace: ${{ job.status }}"
            echo "- Repository-wide formatting remains a separate baseline migration."
          } >> "$GITHUB_STEP_SUMMARY"

  ci-gate:
    name: CI gate
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run reference validation
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm run ci 2>&1 | tee artifacts/ci.log
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: artifacts/ci.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Write summary
        if: always()
        run: |
          {
            echo "## CI gate"
            echo
            echo "- Reference validation (typecheck + tests + JSON contracts + strict audit + audit profiles): ${{ job.status }}"
            if [[ "${{ job.status }}" != "success" ]]; then
              echo "- Diagnostics: artifact \`ci-diagnostics\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
